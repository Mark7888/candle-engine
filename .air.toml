root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go tool templ generate"]
  cmd = "go build -o ./tmp/main cmd/webserver/*.go"
  bin = "tmp/main"
  args_bin = ["-host", ":8080"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go"]
  exclude_dir = ["assets", "tmp"]
  exclude_unchanged = false
  include_file = []
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  include_dir = []
  log = "air.log"
  rerun = true
  rerun_delay = 0
  stop_on_error = false

[log]
  time = true
  main_only = false

[color]
  app = ""
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

[proxy]
  # Enable live-reloading on the browser.
  enabled = true
  proxy_port = 8090
  app_port = 8080
