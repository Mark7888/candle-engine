<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candle Engine</title>
    <script>
      (function () {
        var saved = localStorage.getItem('chakra-ui-color-mode');
        var mode = saved === 'light' ? 'light' : 'dark';
        var isDark = mode === 'dark';
        document.documentElement.style.background = isDark ? '#171923' : '#f7fafc';
        document.documentElement.style.color = isDark ? '#edf2f7' : '#171923';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
